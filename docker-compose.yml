version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maptoposter-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./modules:/app/modules
      - ./themes:/app/themes
      - ./fonts:/app/fonts
      - ./config.yaml:/app/config.yaml
      - ./posters:/app/posters
    environment:
      - PYTHONUNBUFFERED=1
      - APP_DEBUG=false
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - maptoposter-network

  # JS Frontend (Vite Dev Server)
  frontend:
    image: node:20-alpine
    container_name: maptoposter-frontend
    working_dir: /app/frontend/webapp
    volumes:
      - ./frontend/webapp:/app/frontend/webapp
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    networks:
      - maptoposter-network

  # Streamlit GUI (Alternative to JS Frontend)
  streamlit:
    image: python:3.12-slim
    container_name: maptoposter-streamlit
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "
        pip install -r requirements.txt &&
        streamlit run gui_app.py --server.port 8501 --server.address 0.0.0.0
      "
    depends_on:
      - api
    networks:
      - maptoposter-network
    profiles:
      - streamlit

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: maptoposter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - maptoposter-network
    profiles:
      - with-cache

  # Nginx (Production Frontend + Widget)
  nginx:
    image: nginx:alpine
    container_name: maptoposter-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/webapp/dist:/usr/share/nginx/html/webapp:ro
      - ./frontend/widget:/usr/share/nginx/html/widget:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - maptoposter-network
    profiles:
      - production

networks:
  maptoposter-network:
    driver: bridge

volumes:
  redis-data:
